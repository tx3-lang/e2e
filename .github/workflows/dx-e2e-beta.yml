name: DX E2E (beta)

# Runtime + edge-feature journeys that need a beta install. No cron —
# dx-e2e-stable.yml owns the nightly drift check; see it for the `#@ min-tx3c`
# skip gate and native-runner note.
#
# NOTE: staged for the future e2e-as-own-repo extraction. These paths assume
# the e2e/ folder IS the repo root (run.sh, journeys/, lib/ at top level).
# Manifest path filters were removed — manifests are not part of this repo.

on:
  push:
    branches: [main]
    paths:
      - 'run.sh'
      - 'journeys/**'
      - 'lib/**'
      - '.github/workflows/dx-e2e-beta.yml'
      - '.github/actions/dx-e2e-run/**'
  pull_request:
    paths:
      - 'run.sh'
      - 'journeys/**'
      - 'lib/**'
      - '.github/workflows/dx-e2e-beta.yml'
      - '.github/actions/dx-e2e-run/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    name: warmup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dx-e2e-run
        with:
          channel: beta
          warmup-only: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  beta:
    name: beta (${{ matrix.os }} · ${{ matrix.journey }})
    needs: warmup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        journey: [02-lang-tour, 03-lang-edge, 04-devnet-roundtrip, 05-invoke, 07-codegen-consume, 08-interface-consume]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dx-e2e-run
        with:
          channel: beta
          journey: ${{ matrix.journey }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  java-sdk:
    name: beta (ubuntu-24.04 · 12-java-sdk)
    needs: warmup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Require Maven 3.9
        shell: bash
        run: mvn -version | head -n1 | grep -Eq '^Apache Maven 3[.]9[.]'
      - uses: ./.github/actions/dx-e2e-run
        with:
          channel: beta
          journey: 12-java-sdk
          github-token: ${{ secrets.GITHUB_TOKEN }}
