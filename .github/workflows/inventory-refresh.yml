name: Inventory refresh

# Verify one protocol's current release from the public side and open an
# evidence PR: run the public-resolution journey (13) on the stable toolchain,
# store its dated records under inventory/evidence/<protocol>/, regenerate
# that protocol's row and the README. See inventory/REFRESH.md.

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: 'Protocol id from inventory/protocols.json'
        required: true

# Refreshes of one protocol queue; different protocols run side by side and
# touch disjoint evidence.
concurrency:
  group: inventory-refresh-${{ inputs.protocol }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh (${{ inputs.protocol }})
    runs-on: ubuntu-latest
    env:
      PROTOCOL: ${{ inputs.protocol }}
    steps:
      - uses: actions/checkout@v4

      - name: Release spec from the inventory
        run: |
          mkdir -p "$RUNNER_TEMP/inventory"
          python3 inventory/lib/inventory.py spec --protocol "$PROTOCOL" > "$RUNNER_TEMP/inventory/spec.json"

      # An outstanding result still produces records, so the PR carries the
      # diagnosis; the journey's own outcome is reported in the PR body.
      - name: Public resolution journey
        id: journey
        continue-on-error: true
        uses: ./.github/actions/dx-e2e-run
        env:
          PUBLIC_RESOLUTION_SPEC: ${{ runner.temp }}/inventory/spec.json
          PUBLIC_RESOLUTION_OUT: ${{ runner.temp }}/inventory/evidence
        with:
          channel: stable
          journey: 13-public-resolution
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store the records and render
        run: |
          mkdir -p "$RUNNER_TEMP/inventory/evidence"
          python3 inventory/lib/inventory.py ingest --protocol "$PROTOCOL" "$RUNNER_TEMP/inventory/evidence"

      - name: Open the evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.journey.outcome }}
        run: |
          git add -- "inventory/rows/${PROTOCOL}.json" inventory/README.md
          if [ -d "inventory/evidence/${PROTOCOL}" ]; then git add -- "inventory/evidence/${PROTOCOL}"; fi
          if git diff --cached --quiet; then
            echo "no new evidence for ${PROTOCOL}"
            exit 0
          fi
          branch="inventory/${PROTOCOL}-$(date -u +%Y%m%dT%H%M%SZ)"
          title="chore(inventory): refresh ${PROTOCOL} evidence"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "${title}" -m "Generated by ${run_url} (journey ${OUTCOME})."
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" --title "${title}" \
            --body "Generated by the inventory refresh run ${run_url}. The public-resolution journey reported ${OUTCOME}; the rows name anything outstanding. Review the records, then merge."

      - name: Fail the run when the release stays outstanding
        if: steps.journey.outcome != 'success'
        run: |
          echo "::error::the public-resolution journey reported ${{ steps.journey.outcome }}; see the evidence PR or the journey log"
          exit 1
