name: Inventory refresh

# Verify one protocol's current release from the public side and open an
# evidence PR. The verify job runs the public-resolution journey (13) on the
# stable toolchain with a read-only token and uploads its records. Only the
# publish job can write: it stores the records under
# inventory/evidence/<protocol>/, regenerates that protocol's row and the
# README, and opens the PR. See inventory/REFRESH.md.

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: 'Protocol id from inventory/protocols.json'
        required: true
      resolve:
        description: 'auto: resolve again only while the latest resolution of the release is not a pass; always: resolve again'
        type: choice
        options: [auto, always]
        default: auto

# Refreshes of one protocol queue; different protocols run side by side and
# touch disjoint evidence.
concurrency:
  group: inventory-refresh-${{ inputs.protocol }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ inputs.protocol }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.journey.outcome }}
    env:
      PROTOCOL: ${{ inputs.protocol }}
      RESOLVE: ${{ inputs.resolve }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An earlier refresh's records may still sit in an unmerged evidence PR.
      # Without them this run would resolve again and could supersede their pass.
      - name: No unmerged evidence for this protocol
        run: python3 inventory/lib/inventory.py pending --protocol "$PROTOCOL"

      - name: Release spec from the inventory
        run: |
          mkdir -p "$RUNNER_TEMP/inventory/evidence"
          python3 inventory/lib/inventory.py spec --protocol "$PROTOCOL" --resolve "$RESOLVE" > "$RUNNER_TEMP/inventory/spec.json"

      # An outstanding result still produces records, so the PR carries the
      # diagnosis; the journey's own outcome is reported by the publish job.
      - name: Public resolution journey
        id: journey
        continue-on-error: true
        uses: ./.github/actions/dx-e2e-run
        env:
          PUBLIC_RESOLUTION_SPEC: ${{ runner.temp }}/inventory/spec.json
          PUBLIC_RESOLUTION_OUT: ${{ runner.temp }}/inventory/evidence
        with:
          channel: stable
          journey: 13-public-resolution
          github-token: ${{ github.token }}

      # A journey that left no record (the toolchain never installed, say)
      # fails here, and nothing is published.
      - name: Upload the records
        uses: actions/upload-artifact@v4
        with:
          name: inventory-evidence
          path: ${{ runner.temp }}/inventory/evidence
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (${{ inputs.protocol }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PROTOCOL: ${{ inputs.protocol }}
      OUTCOME: ${{ needs.verify.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: inventory-evidence
          path: ${{ runner.temp }}/inventory/evidence

      - name: Store the records and render
        run: python3 inventory/lib/inventory.py ingest --protocol "$PROTOCOL" "$RUNNER_TEMP/inventory/evidence"

      - name: Open the evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- "inventory/rows/${PROTOCOL}.json" inventory/README.md
          if [ -d "inventory/evidence/${PROTOCOL}" ]; then git add -- "inventory/evidence/${PROTOCOL}"; fi
          if git diff --cached --quiet; then
            echo "no new evidence for ${PROTOCOL}"
            exit 0
          fi
          branch="inventory/${PROTOCOL}-$(date -u +%Y%m%dT%H%M%SZ)"
          title="chore(inventory): refresh ${PROTOCOL} evidence"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "${title}" -m "Generated by ${run_url} (journey ${OUTCOME})."
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" --title "${title}" \
            --body "Generated by the inventory refresh run ${run_url}. The public-resolution journey reported ${OUTCOME}; the rows name anything outstanding. Review the records, then merge."

      - name: Fail the run when the release stays outstanding
        if: env.OUTCOME != 'success'
        run: |
          echo "::error::the public-resolution journey reported ${OUTCOME}; see the evidence PR or the journey log"
          exit 1
